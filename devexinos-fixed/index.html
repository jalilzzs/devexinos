<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Devexinos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>

<!-- Splash: first tap unlocks Web Audio -->
<div id="splash" class="screen on" tabindex="0">
  <h1>DEVEXINOS</h1>
  <p data-i="tap">Tap or click to begin</p>
</div>

<!-- Main menu -->
<div id="menu" class="screen">
  <div class="brand">
    <h1 data-t="DEVEXINOS">DEVEXINOS</h1>
    <p class="tag" data-i="tag"></p>
  </div>
  <nav>
    <button class="mbtn" id="mStart" data-i="start"></button>
    <button class="mbtn" id="mCont" data-i="cont"></button>
    <button class="mbtn" id="mLogin" data-i="login"></button>
    <button class="mbtn" id="mSet" data-i="settings"></button>
    <button class="mbtn" id="mStory" data-i="story"></button>
    <button class="mbtn" id="mTos" data-i="tos"></button>
    <button class="mbtn" id="mSup" data-i="support"></button>
    <div id="acct"></div>
  </nav>
  <div id="footnote">v1.0 · Part 1: The Mansion</div>
</div>

<!-- Settings -->
<div id="settings" class="screen panel">
  <div class="card">
    <h2 data-i="settings"></h2>
    <div class="row"><label data-i="gfx"></label>
      <select data-k="gfx"><option value="medium" data-i="medium"></option><option value="high" data-i="high"></option></select></div>
    <div class="row"><label data-i="shadows"></label><input type="checkbox" data-k="shadows"></div>
    <div class="row"><label data-i="fps"></label>
      <select data-k="fps" data-num="1"><option value="30">30</option><option value="60">60</option><option value="90">90</option><option value="0" data-i="unlimited"></option></select></div>
    <div class="row"><label data-i="lang"></label>
      <select data-k="lang"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="zh">中文</option></select></div>
    <div class="row"><label data-i="sens"></label><input type="range" min="0.3" max="2.5" step="0.05" data-k="sens"></div>
    <div class="row"><label data-i="master"></label><input type="range" min="0" max="1" step="0.01" data-k="master"></div>
    <div class="row"><label data-i="sfx"></label><input type="range" min="0" max="1" step="0.01" data-k="sfx"></div>
    <div class="row"><label data-i="bgm"></label><input type="range" min="0" max="1" step="0.01" data-k="bgm"></div>
    <div class="row"><label data-i="btnsize"></label><input type="range" min="0.6" max="1.6" step="0.05" data-k="size"></div>
    <div class="row"><label data-i="forceTouch"></label><input type="checkbox" data-k="forceTouch"></div>
    <div class="row"><label data-i="assets"></label></div>
    <p class="note" data-i="dropHint"></p>
    <div class="row"><label id="assetList">—</label><label class="rbtn" for="assetPick">+ .glb / audio</label><input type="file" id="assetPick" multiple accept=".glb,.gltf,audio/*" hidden></div>
    <div class="actions">
      <button class="rbtn" id="sResetSave" data-i="resetSave"></button>
      <button class="rbtn" id="sClearAssets" data-i="clearAssets"></button>
    </div>
    <div class="actions">
      <button class="rbtn" id="sEdit" data-i="edit"></button>
      <button class="rbtn" id="sTest" data-i="testSfx"></button>
      <button class="rbtn main" id="sBack" data-i="back"></button>
    </div>
  </div>
</div>

<!-- Story log -->
<div id="story" class="screen panel"><div class="card">
  <h2 data-i="story"></h2><div id="logList"></div>
  <div class="actions"><button class="rbtn main" data-close data-i="back"></button></div>
</div></div>

<!-- Inventory -->
<div id="inv" class="screen panel"><div class="card">
  <h2 data-i="inventory"></h2><div id="invList"></div>
  <div class="actions"><button class="rbtn main" data-close data-i="close"></button></div>
</div></div>

<!-- ToS -->
<div id="tos" class="screen panel"><div class="card">
  <h2 data-i="tos"></h2><p data-i="tosText"></p>
  <div class="actions"><button class="rbtn main" data-close data-i="back"></button></div>
</div></div>

<!-- Support -->
<div id="support" class="screen panel"><div class="card">
  <h2 data-i="support"></h2><p data-i="supportText"></p>
  <div class="actions"><button class="rbtn main" data-close data-i="back"></button></div>
</div></div>

<!-- Login (simulated) -->
<div id="loginBox" class="screen panel"><div class="card">
  <h2 data-i="login"></h2><p data-i="loginText"></p>
  <div class="actions">
    <button class="rbtn main" id="lgIn" data-i="loginDo"></button>
    <button class="rbtn" id="lgOut" data-i="logout"></button>
    <button class="rbtn" data-close data-i="back"></button>
  </div>
</div></div>

<!-- Pause -->
<div id="pause" class="screen panel"><div class="card">
  <h2 data-i="paused"></h2>
  <div class="actions" style="flex-direction:column">
    <button class="rbtn main" id="pResume" data-i="resume"></button>
    <button class="rbtn" id="pSet" data-i="settings"></button>
    <button class="rbtn" id="pQuit" data-i="toMenu"></button>
  </div>
</div></div>


<!-- Document reader -->
<div id="doc" class="screen panel"><div class="card paper"><h2 id="docTitle"></h2><p id="docText"></p><div class="actions"><button class="rbtn" id="docOk" data-i="close"></button></div></div></div>
<!-- Safe keypad -->
<div id="keypad" class="screen panel"><div class="card"><h2 id="kpTitle"></h2><p id="kpHint"></p><div id="kpDisp"></div><div id="kpPad"></div><div class="actions"><button class="rbtn" data-close data-i="close"></button></div></div></div>
<!-- Fuse box -->
<div id="fuse" class="screen panel"><div class="card"><h2 id="fuseTitle"></h2><p id="fuseHint"></p><div id="fuseBody"></div><div class="actions"><button class="rbtn" data-close data-i="close"></button></div></div></div>
<!-- Ending card -->
<div id="endcard" class="screen"><div class="endwrap"><h1 id="endTxt"></h1><button class="rbtn" id="endBtn"></button></div></div>
<div id="fade"></div><div id="sun"></div><div id="ring"></div><div id="hideov"></div>

<!-- Phone (press P) -->
<div id="phone" class="screen"><div class="phone">
  <div class="ph-status"><span id="phTime"></span><span id="phSig"></span><span id="phBat"></span></div>
  <div id="phScreen" class="ph-screen"></div>
  <div class="ph-nav"><button id="phBack">◀</button><button id="phHome">●</button><button id="phClose">✕</button></div>
</div></div>
<!-- Camera viewfinder -->
<div id="camui"><i class="cv tl"></i><i class="cv tr"></i><i class="cv bl"></i><i class="cv br"></i><div id="camRec">● REC</div><div id="camCount"></div><div id="camShutter"></div><div id="camClose">✕</div></div>
<div id="shutterfx"></div>
<!-- HUD -->
<div id="hud">
  <div id="vig"></div>
  <div id="cross"></div>
  <div id="hint"></div>
  <div id="sub"></div>
  <svg id="heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2 0 3.4 1.1 4.2 2.4h3.6C14.6 6.1 16 5 18 5c3.3 0 5.1 3.4 3.6 6.8C19.500 16.400 12 21 12 21z"/></svg>
  <div id="fps"></div>
  <div id="keys"></div>
  <div class="ui hbtn" id="bMenu" data-id="bMenu">☰</div>
  <div class="ui hbtn touchonly" id="bFlash" data-id="bFlash">🔦</div>
  <div class="ui hbtn touchonly" id="bInv" data-id="bInv">🎒</div>
  <div class="ui hbtn touchonly" id="bLog" data-id="bLog">📖</div>
  <div class="ui hbtn act touchonly" id="bAct" data-id="bAct">✋</div>
  <div class="ui hbtn touchonly" id="bCrouch" data-id="bCrouch">🧎</div>
  <div class="ui hbtn touchonly" id="bRun" data-id="bRun">🏃</div>
  <div class="ui hbtn touchonly" id="bPhone" data-id="bPhone">📱</div>
  <div class="ui touchonly" id="joy" data-id="joy"><i></i></div>
</div>
<div id="edbar"><span data-i="editHint"></span><button class="rbtn" id="edReset" data-i="reset"></button><button class="rbtn main" id="edDone" data-i="done"></button></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="js/i18n.js"></script>
<script src="js/persistence.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/world.js"></script>
<script src="js/weapons.js"></script>
<script src="js/player.js"></script>
<script src="js/npc.js"></script>
<script src="js/missions.js"></script>
<script src="js/cutscenes.js"></script>
<script src="js/phone.js"></script>
<script src="js/systems.js"></script>
<script src="js/main.js"></script>
</body>
</html>
